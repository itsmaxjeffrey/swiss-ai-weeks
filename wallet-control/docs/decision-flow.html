<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wallet control — decision flow</title>
<style>
  body { margin: 0; background: #f8fafc; font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 21px; font-weight: 700; fill: #172033; }
  .subtitle { font-size: 13px; fill: #5b6475; }
  .h { font-size: 15px; font-weight: 700; fill: #172033; }
  .s { font-size: 12px; fill: #5b6475; }
  .oh { font-size: 16px; font-weight: 800; }
  .chip { font-size: 11px; font-weight: 600; fill: #2a3442; }
  .lg { font-size: 11px; font-weight: 600; fill: #2a3442; }
  .el { font-size: 11px; font-weight: 700; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
  .ph { font-size: 13px; font-weight: 700; fill: #172033; }
  .pl { font-size: 12px; fill: #3d4757; }
  .cap { font-size: 12px; font-style: italic; fill: #5b6475; }
  .edge { stroke: #64748b; stroke-width: 1.6; fill: none; }
  .edgeh { stroke: #8a7663; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
</style>
<svg viewBox="0 0 1280 1110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7663"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1110" fill="#f8fafc"/>

  <!-- ============ edges (drawn first) ============ -->
  <g>
    <path class="edge" d="M420,208 V240" marker-end="url(#ar)"/>
    <path class="edge" d="M420,332 V364" marker-end="url(#ar)"/>
    <path class="edge" d="M420,470 V502" marker-end="url(#ar)"/>
    <path class="edge" d="M420,608 V640" marker-end="url(#ar)"/>
    <path class="edge" d="M420,732 V772" marker-end="url(#ar)"/>

    <!-- Q1 -> step_up -->
    <path class="edge" d="M700,286 H780 V462 H880" marker-end="url(#ar)"/>
    <!-- Q2 -> decline -->
    <path class="edge" d="M700,410 H796 V310 H880" marker-end="url(#ar)"/>
    <!-- Q3 breach -> step_up -->
    <path class="edge" d="M700,545 H818 V494 H880" marker-end="url(#ar)"/>
    <!-- Q3 retry -> decline -->
    <path class="edge" d="M700,566 H832 V346 H880" marker-end="url(#ar)"/>
    <!-- Q4 -> policy -->
    <path class="edge" d="M700,672 H760" marker-end="url(#ar)"/>
    <!-- policy -> step_up -->
    <path class="edge" d="M980,640 V516" marker-end="url(#ar)"/>
    <!-- policy -> decline (around the outside) -->
    <path class="edge" d="M1060,664 H1230 V310 H1200" marker-end="url(#ar)"/>

    <!-- interface feedback loops -->
    <path class="edgeh" d="M1080,516 V880" marker-end="url(#arh)"/>
    <path class="edgeh" d="M690,880 V836" marker-end="url(#arh)"/>
  </g>

  <!-- ============ edge labels ============ -->
  <g>
    <text class="el" x="432" y="352" fill="#5b6475">no</text>
    <text class="el" x="432" y="490" fill="#5b6475">no</text>
    <text class="el" x="432" y="628" fill="#5b6475">no</text>
    <text class="el" x="432" y="756" fill="#3a8a3f">no — all clear</text>
    <text class="el" x="708" y="278" fill="#9a6a12">yes — manipulation</text>
    <text class="el" x="708" y="402" fill="#a03a30">yes — hard fail</text>
    <text class="el" x="708" y="537" fill="#9a6a12">breach → ask</text>
    <text class="el" x="708" y="586" fill="#a03a30">retry of declined → decline</text>
    <text class="el" x="712" y="664" fill="#5b6475">yes</text>
    <text class="el" x="972" y="586" fill="#9a6a12" text-anchor="end">ask</text>
    <text class="el" x="1092" y="656" fill="#a03a30">set-decline</text>
    <text class="el" x="1088" y="760" fill="#8a7663">customer decides</text>
    <text class="el" x="698" y="864" fill="#3a8a3f">customer approves</text>
  </g>

  <!-- ============ legend ============ -->
  <g>
    <rect x="140" y="84" width="52" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1.2"/>
    <text class="lg" x="166" y="98" text-anchor="middle">Rules</text>
    <rect x="198" y="84" width="140" height="20" rx="10" fill="#e6f4f2" stroke="#2e8b7a" stroke-width="1.2"/>
    <text class="lg" x="268" y="98" text-anchor="middle">Behavioural signals</text>
    <rect x="344" y="84" width="100" height="20" rx="10" fill="#f3eefa" stroke="#7c5cbf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text class="lg" x="394" y="98" text-anchor="middle">ML — advisory</text>
    <rect x="450" y="84" width="124" height="20" rx="10" fill="#fdf6e7" stroke="#c9971c" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text class="lg" x="512" y="98" text-anchor="middle">LLM — drafts only</text>
    <rect x="580" y="84" width="124" height="20" rx="10" fill="#f5f0ea" stroke="#8a7663" stroke-width="1.2"/>
    <text class="lg" x="642" y="98" text-anchor="middle">Human / interface</text>

    <rect x="140" y="112" width="64" height="20" rx="10" fill="#e4f4e4" stroke="#3a8a3f" stroke-width="1.2"/>
    <text class="lg" x="172" y="126" text-anchor="middle">Approve</text>
    <rect x="210" y="112" width="100" height="20" rx="10" fill="#fdf3dd" stroke="#c98a1e" stroke-width="1.2"/>
    <text class="lg" x="260" y="126" text-anchor="middle">Step-up = ask</text>
    <rect x="316" y="112" width="64" height="20" rx="10" fill="#fbe9e7" stroke="#c0453a" stroke-width="1.2"/>
    <text class="lg" x="348" y="126" text-anchor="middle">Decline</text>
  </g>

  <!-- ============ title ============ -->
  <text class="title" x="80" y="42">Wallet control: how the pieces combine into one decision</text>
  <text class="subtitle" x="80" y="64">Rules decide · signals and ML advise · LLMs only draft · the interface keeps the human in charge</text>

  <!-- ============ input node ============ -->
  <rect x="140" y="150" width="560" height="58" rx="12" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="164" y="176">AI shopping agent proposes a purchase</text>
  <text class="s" x="164" y="196">amount · basket · merchant · untrusted listing text</text>

  <!-- ============ Q1 manipulation scan ============ -->
  <rect x="140" y="240" width="560" height="92" rx="12" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.5"/>
  <text class="h" x="164" y="266">① Manipulation scan — did the text try anything?</text>
  <rect x="164" y="276" width="96" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="212" y="290" text-anchor="middle">rule patterns</text>
  <rect x="266" y="276" width="200" height="20" rx="10" fill="#f3eefa" stroke="#7c5cbf" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="chip" x="366" y="290" text-anchor="middle">trained text scorer — advisory</text>
  <text class="s" x="164" y="318">hits are quoted to the customer — the scan never approves or declines alone</text>

  <!-- ============ Q2 hard rules ============ -->
  <rect x="140" y="364" width="560" height="106" rx="12" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.5"/>
  <text class="h" x="164" y="390">② Hard mandate rules — any hard fail?</text>
  <rect x="164" y="400" width="172" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="250" y="414" text-anchor="middle">cap + rolling 7-day spend</text>
  <rect x="342" y="400" width="164" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="424" y="414" text-anchor="middle">categories · single-item</text>
  <rect x="512" y="400" width="132" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="578" y="414" text-anchor="middle">requested item spec</text>
  <rect x="164" y="426" width="96" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="212" y="440" text-anchor="middle">return window</text>
  <rect x="266" y="426" width="200" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="366" y="440" text-anchor="middle">specialist / familiar merchant</text>
  <rect x="472" y="426" width="172" height="20" rx="10" fill="#e7effb" stroke="#3b6ea5" stroke-width="1"/>
  <text class="chip" x="558" y="440" text-anchor="middle">unknown field → uncertain</text>
  <text class="s" x="164" y="462">fail → decline, with every reason in plain language</text>

  <!-- ============ Q3 behavioural signals ============ -->
  <rect x="140" y="502" width="560" height="106" rx="12" fill="#ffffff" stroke="#2e8b7a" stroke-width="1.5"/>
  <text class="h" x="164" y="528">③ Behavioural signals — off-pattern right now?</text>
  <rect x="160" y="538" width="80" height="20" rx="10" fill="#e6f4f2" stroke="#2e8b7a" stroke-width="1"/>
  <text class="chip" x="200" y="552" text-anchor="middle">new device</text>
  <rect x="246" y="538" width="104" height="20" rx="10" fill="#e6f4f2" stroke="#2e8b7a" stroke-width="1"/>
  <text class="chip" x="298" y="552" text-anchor="middle">burst velocity</text>
  <rect x="356" y="538" width="76" height="20" rx="10" fill="#e6f4f2" stroke="#2e8b7a" stroke-width="1"/>
  <text class="chip" x="394" y="552" text-anchor="middle">odd hours</text>
  <rect x="438" y="538" width="226" height="20" rx="10" fill="#e6f4f2" stroke="#2e8b7a" stroke-width="1"/>
  <text class="chip" x="551" y="552" text-anchor="middle">duplicate / split · lookalike name</text>
  <text class="s" x="164" y="580">your own purchase history defines “normal” — deviation asks, it doesn’t block</text>

  <!-- ============ Q4 uncertainty ============ -->
  <rect x="140" y="640" width="560" height="92" rx="12" fill="#ffffff" stroke="#7c5cbf" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="h" x="164" y="666">④ Anything still uncertain?</text>
  <rect x="164" y="676" width="190" height="20" rx="10" fill="#f3eefa" stroke="#7c5cbf" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="chip" x="259" y="690" text-anchor="middle">ML deviation — escalate band</text>
  <rect x="360" y="676" width="152" height="20" rx="10" fill="#f3eefa" stroke="#7c5cbf" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="chip" x="436" y="690" text-anchor="middle">facts / fields unknown</text>
  <rect x="518" y="676" width="116" height="20" rx="10" fill="#f3eefa" stroke="#7c5cbf" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="chip" x="576" y="690" text-anchor="middle">terms not stated</text>
  <text class="s" x="164" y="718">an escalate-band anomaly becomes a question — never an auto-decline</text>

  <!-- ============ outcomes ============ -->
  <rect x="880" y="290" width="320" height="76" rx="14" fill="#fbe9e7" stroke="#c0453a" stroke-width="2"/>
  <text class="oh" x="1040" y="322" text-anchor="middle" fill="#a03a30">DECLINE — block the purchase</text>
  <text class="s" x="1040" y="342" text-anchor="middle">every reason, in plain language</text>
  <text class="s" x="1040" y="358" text-anchor="middle">a retry of a declined order re-declines</text>

  <rect x="880" y="440" width="320" height="76" rx="14" fill="#fdf3dd" stroke="#c98a1e" stroke-width="2"/>
  <text class="oh" x="1040" y="472" text-anchor="middle" fill="#9a6a12">STEP_UP — ask the customer</text>
  <text class="s" x="1040" y="492" text-anchor="middle">120 s countdown · evidence grid</text>
  <text class="s" x="1040" y="508" text-anchor="middle">injection text shown quoted</text>

  <rect x="140" y="772" width="560" height="64" rx="14" fill="#e4f4e4" stroke="#3a8a3f" stroke-width="2"/>
  <text class="oh" x="420" y="800" text-anchor="middle" fill="#2f6e33">APPROVE — let it spend</text>
  <text class="s" x="420" y="820" text-anchor="middle">evidence attached · approved spend counts toward the rolling cap</text>

  <!-- ============ uncertainty policy node ============ -->
  <rect x="760" y="640" width="300" height="64" rx="12" fill="#f5f0ea" stroke="#8a7663" stroke-width="1.5"/>
  <text class="h" x="910" y="664" text-anchor="middle" font-size="13">Uncertainty policy (customer sets it)</text>
  <text class="s" x="910" y="686" text-anchor="middle">ask → step_up · decline-on-unknown → decline</text>

  <text class="cap" x="420" y="862" text-anchor="middle">Priority order: decline beats ask · ask beats approve · uncertainty is never permission</text>

  <!-- ============ interface panel ============ -->
  <rect x="80" y="880" width="1120" height="196" rx="16" fill="#faf7f2" stroke="#8a7663" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="ph" x="104" y="908" font-size="14">The interface is the fourth decision-maker — nothing above is invisible or irreversible</text>

  <rect x="104" y="928" width="340" height="118" rx="10" fill="#ffffff" stroke="#c9b8a3" stroke-width="1.2"/>
  <text class="ph" x="120" y="952">Policy compiler — confirm before active</text>
  <text class="pl" x="120" y="976">instruction → proposed rules → customer confirms</text>
  <text class="pl" x="120" y="996">LLM may draft the long tail — it never decides</text>
  <text class="pl" x="120" y="1016">tightening-only · revocation is instant</text>

  <rect x="470" y="928" width="340" height="118" rx="10" fill="#ffffff" stroke="#c9b8a3" stroke-width="1.2"/>
  <text class="ph" x="486" y="952">Step-up inbox — the human path</text>
  <text class="pl" x="486" y="976">countdown · evidence grid · quoted injection</text>
  <text class="pl" x="486" y="996">customer’s approve / decline becomes the decision</text>
  <text class="pl" x="486" y="1016">approved spend counts toward the cap</text>

  <rect x="836" y="928" width="340" height="118" rx="10" fill="#ffffff" stroke="#c9b8a3" stroke-width="1.2"/>
  <text class="ph" x="852" y="952">Transparency by default</text>
  <text class="pl" x="852" y="976">every decision: reason codes + evidence grid</text>
  <text class="pl" x="852" y="996">unknown ⇒ ask, never guess</text>
  <text class="pl" x="852" y="1016">missing signals drop out — the rule core still decides</text>
</svg>
</html>
